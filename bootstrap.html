<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Care Tips</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fff5f7;
    }
    .hero {
      background-color: #f8d7da;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="hero">
  <h1>Hair Care & Tips</h1>
  <p>Healthy hair starts with the right routine 💖</p>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="#">HairCare</a>
  </div>
</nav>

<!-- ===================== -->
<!-- INTERACTION 1: CAROUSEL -->
<!-- ===================== -->
<div class="container mt-4">
  <h2 class="text-center mb-3">Hair Inspiration</h2>

  <div id="hairCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://via.placeholder.com/800x400?text=Healthy+Hair" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://via.placeholder.com/800x400?text=Curly+Hair+Care" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://via.placeholder.com/800x400?text=Hair+Routine" class="d-block w-100">
      </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#hairCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#hairCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>

<!-- ===================== -->
<!-- INTERACTION 2: COLLAPSE -->
<!-- ===================== -->
<div class="container mt-5 text-center">
  <h2>Hair Care Tips</h2>

  <button class="btn btn-primary mt-3" data-bs-toggle="collapse" data-bs-target="#tips">
    Show Tips
  </button>

  <div id="tips" class="collapse mt-3">
    <div class="card card-body">
      • Avoid excessive heat styling <br>
      • Use sulfate-free shampoo <br>
      • Deep condition weekly <br>
      • Trim split ends regularly
    </div>
  </div>
</div>

<!-- ===================== -->
<!-- INTERACTION 3: FORM -->
<!-- ===================== -->
<div class="container mt-5 mb-5">
  <h2 class="text-center">Get Personalized Tips</h2>

  <form>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" placeholder="Enter your name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Enter your email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Hair Type</label>
      <select class="form-select">
        <option>Straight</option>
        <option>Wavy</option>
        <option>Curly</option>
        <option>Coily</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Your Hair Goals</label>
      <textarea class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-success">Submit</button>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
